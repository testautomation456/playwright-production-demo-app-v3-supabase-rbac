<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orders | Enterprise Demo</title><link rel="stylesheet" href="/assets/css/app.css"></head><body>
<div class="app-layout">
  <aside class="sidebar"><div class="logo"><span class="logo-mark">QA</span><span>Enterprise Demo</span></div><nav class="nav" data-nav></nav><div class="user-chip"><strong data-user-name>Loading...</strong><span data-user-role></span></div></aside>
  <main class="main">
    <div class="topbar"><div><h1 data-testid="orders-title">Orders</h1><p>Order management page with relational database data.</p></div></div>
    <section class="split">
      <form class="card" data-order-form><h2>Create order</h2><div class="form-row"><label>Order No</label><input name="order_no" value="ORD-AUTO-1" required></div><div class="form-row"><label>Customer</label><select name="customer_id"></select></div><div class="form-row"><label>Product</label><select name="product_id"></select></div><div class="form-row"><label>Assigned user</label><select name="assigned_user_id"></select></div><div class="form-row"><label>Quantity</label><input name="quantity" type="number" value="1"></div><div class="form-row"><label>Amount</label><input name="amount" type="number" step="0.01" value="25.00"></div><div class="form-row"><label>Status</label><select name="status"><option>New</option><option>Processing</option><option>Shipped</option><option>Completed</option><option>Cancelled</option></select></div><div class="form-row"><label>Priority</label><select name="priority"><option>Low</option><option>Normal</option><option>High</option></select></div><button class="btn">Create order</button></form>
      <div class="card"><h2>Order grid</h2><div class="table-wrap"><table><thead><tr><th>Order</th><th>Customer</th><th>Product</th><th>Assigned</th><th>Status</th><th>Priority</th><th>Amount</th><th>Actions</th></tr></thead><tbody data-orders-body></tbody></table></div></div>
    </section>
  </main>
</div>
<script src="/assets/js/app.js"></script><script>DemoApp.pageOrders()</script>
</body></html>
