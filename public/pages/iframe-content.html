<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Iframe Content</title><style>
body{font-family:Inter,Arial,sans-serif;margin:0;background:#f5f7fb;color:#172033;padding:24px} .card{background:white;border:1px solid #dce3f0;border-radius:18px;padding:22px;box-shadow:0 14px 30px rgba(38,56,88,.08)} label{font-weight:700;font-size:13px;color:#5d6b82} input,select,textarea{width:100%;padding:12px;border:1px solid #dce3f0;border-radius:12px;margin:6px 0 14px} button{background:#536dfe;color:white;border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer}.result{margin-top:14px;padding:12px;border-radius:12px;background:#eef3ff}
</style></head><body>
<div class="card">
  <h1 data-testid="iframe-heading">Iframe Form</h1>
  <p>This form is inside an iframe.</p>
  <label>Name</label><input data-testid="iframe-name" placeholder="Inside Frame">
  <label>Status</label><select data-testid="iframe-status"><option>New</option><option>Pending</option><option>Approved</option></select>
  <label>Notes</label><textarea data-testid="iframe-notes" rows="4"></textarea>
  <button data-testid="iframe-save">Save iframe form</button>
  <div class="result" data-testid="iframe-result" hidden></div>
</div>
<script>
document.querySelector('[data-testid="iframe-save"]').addEventListener('click', () => {
  const name = document.querySelector('[data-testid="iframe-name"]').value;
  const status = document.querySelector('[data-testid="iframe-status"]').value;
  const result = document.querySelector('[data-testid="iframe-result"]');
  result.hidden = false;
  result.textContent = `Saved iframe value: ${name} / ${status}`;
});
</script>
</body></html>
