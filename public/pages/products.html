<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Products | Enterprise Demo</title><link rel="stylesheet" href="/assets/css/app.css"></head><body>
<div class="app-layout">
  <aside class="sidebar"><div class="logo"><span class="logo-mark">QA</span><span>Enterprise Demo</span></div><nav class="nav" data-nav></nav><div class="user-chip"><strong data-user-name>Loading...</strong><span data-user-role></span></div></aside>
  <main class="main">
    <div class="topbar"><div><h1 data-testid="products-title">Products</h1><p>Dynamic product catalog for API/UI automation.</p></div></div>
    <section class="split">
      <form class="card" data-product-form><h2>Create product</h2><div class="form-row"><label>SKU</label><input name="sku" value="SKU-AUTO-1" required></div><div class="form-row"><label>Name</label><input name="name" required></div><div class="form-row"><label>Category</label><input name="category" value="Testing"></div><div class="form-row"><label>Price</label><input name="price" type="number" step="0.01" value="19.99"></div><div class="form-row"><label>Stock</label><input name="stock" type="number" value="10"></div><div class="form-row"><label>Status</label><select name="status"><option>Active</option><option>Draft</option><option>Discontinued</option></select></div><button class="btn">Create product</button></form>
      <div class="card"><h2>Product grid</h2><div class="table-wrap"><table><thead><tr><th>SKU</th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Status</th></tr></thead><tbody data-products-body></tbody></table></div></div>
    </section>
  </main>
</div>
<script src="/assets/js/app.js"></script><script>DemoApp.pageProducts()</script>
</body></html>
