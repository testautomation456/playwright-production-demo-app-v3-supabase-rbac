services:
  - type: web
    name: playwright-production-demo-app-v3
    runtime: node
    plan: free
    buildCommand: npm install && npm run db:schema && npm run db:seed
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
