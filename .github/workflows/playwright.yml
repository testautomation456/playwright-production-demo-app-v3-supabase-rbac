name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # Render's free tier sleeps when idle; retry until the app is awake.
      - name: Wake the deployed app
        run: curl --retry 12 --retry-delay 10 --retry-all-errors -fsS "$BASE_URL/api/health"
        env:
          BASE_URL: ${{ secrets.BASE_URL }}

      - name: Run Playwright tests against the deployed app
        run: npx playwright test
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
          SKIP_WEB_SERVER: '1'
          CI: 'true'

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
